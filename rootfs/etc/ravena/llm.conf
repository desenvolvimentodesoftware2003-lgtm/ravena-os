# /etc/ravena/llm.conf -- sobrescritas do ravena-llm.sh (Bloco I, §6.7)
# O script faz `source` deste arquivo DEPOIS de aplicar os defaults; descomente
# só o que quiser mudar. Comentar = default do script.
#
# LLM_QUANT=Q4_k_m                 # quantizacao priorizada na busca do GGUF
# LLM_PORT=8080                    # porta do llama-server / airLLM
# LLM_THREADS=4                    # threads do llama-server (default: nproc)
#
# CORS do llama-server (se a build tiver --cors-origins; ver ravena-llm.sh):
#   localhost  = origens locais de browser (default restrito)
#   *          = qualquer origem (default upstream do llama.cpp)
#   lista      = ip1,ip2,http://app.local
# LLM_CORS_ORIGINS=localhost
