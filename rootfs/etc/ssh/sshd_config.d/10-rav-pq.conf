# RAVENA PQ - KEX pos-quantico hibrido no SSH (OpenSSH 10.4, mlkem768x25519 = FIPS 203)
# e assinatura de host hibrida MLDSA44-ED25519 (FIPS 204).
# O prefixo "+" adiciona aos algoritmos padrao (retrocompativel com clientes antigos).
KexAlgorithms +mlkem768x25519-sha256,sntrup761x25519-sha512
HostKeyAlgorithms +ssh-mldsa44-ed25519@openssh.com

# Chaves de host: ed25519 (classica) + MLDSA44-ED25519 (hibrida FIPS 204)
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_mldsa44_ed25519_key